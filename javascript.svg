<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 100" width="100%" height="100%">
  <defs>
    <style>
      .texto-digitado {
        font-family: 'Courier New', Courier, monospace;
        font-size: 24px;
        font-weight: bold;
        white-space: pre;

        animation: 
          digitar 4s steps(30, end) infinite alternate,
          cursor .75s step-end infinite;
        
        clip-path: polygon(0 0, 0 100%, 0 100%, 0 0);
      }

      @keyframes digitar {
        from { clip-path: polygon(0 0, 0% 0, 0% 100%, 0 100%); }
        to { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); }
      }

    </style>
  </defs>

  <text x="40" y="55" class="texto-digitado"><tspan fill="#47C1F7">console.</tspan><tspan fill="#873BF7">log</tspan><tspan fill="#F7EF78">(</tspan><tspan fill="#47C1F7">"Bem vindo ao perfil!"</tspan><tspan fill="#F7EF78FF">);  </tspan></text>
</svg>
